[package]
name = "rota-sim"
version = "0.1.0"
edition = "2021"
publish = false
description = "ROTA-Simulator — dieselben Kampfregeln wie das Spiel, ereignisgesteuert und deterministisch"

# Der Einstiegspunkt (#897). Cargo faende `src/bin/rota-sim.rs` auch von selbst;
# der Abschnitt steht trotzdem hier, damit der Pfad an einer Stelle ausgesprochen
# ist, die man liest, bevor man den Quelltext durchsucht.
#
# ER BRINGT KEINE ABHAENGIGKEIT MIT, und das ist keine Nachlaessigkeit, sondern
# der Grund, warum der Argument-Zerleger von Hand geschrieben ist: In Cargo gilt
# `[dependencies]` fuer ALLE Ziele eines Pakets. Ein `clap` hier waere ein `clap`
# in der Bibliothek — und damit bei jedem, der sie einbindet.
[[bin]]
name = "rota-sim"
path = "src/bin/rota-sim.rs"

# Die Bibliothek selbst hat KEINE Abhaengigkeiten. Das ist Absicht: Eine Kiste,
# die im Schritt Speicher anfordert oder ihre Zufallszahlen zwischen zwei
# Fassungen anders erzeugt, wuerde den Determinismus aus GAME-DESIGN 18.4
# unterlaufen — und genau der ist der Zweck dieses Simulators.
[dependencies]

# Nur zur Bauzeit: build.rs verwandelt data/*.json in statische Rust-Werte.
# Zur Laufzeit ist kein JSON mehr vorhanden, also auch kein Parser noetig.
[build-dependencies]
serde_json = "1"

# Nur fuer Tests: Der Nachweis, dass die einkompilierten Werte Feld fuer Feld
# denen aus data/ entsprechen, liest das JSON ein zweites Mal — bewusst auf
# einem anderen Weg als build.rs, sonst pruefte der Test seinen eigenen Fehler mit.
#
# `syn` liest die eigenen Quelldateien als Syntaxbaum — der Waechter gegen tote
# oeffentliche Symbole (#815). Ein Zeilenmuster taete es NICHT: Bei der Messung
# zu diesem Issue hat eine Textsuche dreimal falsch gezaehlt, einmal weil ein
# Kommentar als Nutzung galt, einmal weil eine gleichnamige lokale Variable
# mitzaehlte, einmal weil das Dateimuster keine Ziffern kannte.
#
# Es kostet KEIN zusaetzliches Paket: `serde_json` zieht `serde` zieht
# `serde_derive` zieht `syn` — gemessen an Cargo.lock, 12 Pakete vorher wie
# nachher. Und es beruehrt den Determinismus nicht, weil es weder in der
# Bibliothek noch im Bau vorkommt.
[dev-dependencies]
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
# Fuer die Token-Ebene: `syn` parst Makro-ARGUMENTE nicht als Baum — sie sind
# ein TokenStream. Ohne dieses Paket waere jeder Aufruf in `assert_eq!` oder
# `println!` unsichtbar, und der Waechter meldete zwoelf lebende Methoden als
# tot (gemessen). `syn` zieht es ohnehin.
proc-macro2 = "1"
