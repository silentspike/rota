name: Meta

# Was hier bleibt, ist bewusst NICHT Teil von ci-pass: ein falscher PR-Titel ist
# kosmetisch und soll den Code nicht blockieren, aber sichtbar sein.
#
# actionlint und secret-scan sind aus genau diesem Grund nach ci.yml gewandert
# (PR #66): Ein gefundenes Geheimnis oder ein syntaktisch kaputter Workflow darf
# NICHT mergebar sein. Belegt an PR #65, der mit rotem pr-title durchging —
# was bei pr-title gewollt ist, bei secret-scan aber ein Loch gewesen wäre.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: meta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            perf
            ci
            build
