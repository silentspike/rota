name: Nightly

# Alles Schwere. Blockiert nie einen PR (WORKER-GUIDE: PR-Gate unter 3 Minuten).
# Der Balance-Lauf mit tausenden Durchgängen gehört genau hierhin.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Compiler aus rust-toolchain.toml, wie im PR-Gate (ci.yml, Job sim) —
      # derselbe, mit dem cargo remote v2 baut.
      - id: pin
        name: Rust-Pin lesen
        shell: bash
        run: |
          pin=$(python3 -B tools/rust-pin.py)
          echo "toolchain=$pin" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: ${{ steps.pin.outputs.toolchain }}
      - name: Gepinnter Compiler aktiv
        shell: bash
        run: python3 -B tools/rust-pin.py --rustc "$(rustc --version)"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Referenz-Rechnung Schritt 1
        run: python3 tools/step1-check.py
      # Alles Folgende im Release-Bau. Im Debug ist der Läufer rund achtzehnmal
      # langsamer — für zehntausend Durchgänge ist das der Unterschied zwischen
      # Sekunden und Minuten.
      - name: Balance-Lauf
        run: |
          cargo run --release --quiet --example balance \
            --manifest-path sim/Cargo.toml -- --iterations 10000 --threads 4
      - name: Boss-Machbarkeit und Erfolgs-Prüflauf
        # Endet mit 1, wenn für einen Erfolg keine Lösung existiert — dann gilt
        # der Boss als nicht auslieferbar (GAME-DESIGN 12.9).
        run: cargo run --release --quiet --example report --manifest-path sim/Cargo.toml
      - name: Abgleich Simulator gegen Spiel
        # Läuft im PR-Gate bereits, hier zusätzlich im Release-Bau: Optimierungen
        # dürfen Fließkomma-Operationen umordnen, und die Zustands-Prüfsumme
        # rührt Fließkomma-Bits ein.
        run: cargo run --release --quiet --example parity --manifest-path sim/Cargo.toml
      - name: Zauber-Abdeckung der ersten Instanz
        # Issue #550 AC5. Endet mit 1, wenn über die vier Bosse der ersten
        # Instanz weniger als 11 spielbare Zauber gewirkt werden — dann hat ein
        # Zauber seine Nische verloren oder ein Boss erzwingt sie nicht mehr.
        #
        # Gezählt werden NISCHEN, nicht Suchwege (Variante B, 29.10.): je Boss
        # die bessere von freier Suche und Bestliste vom 14.08. Mit der freien
        # Suche allein fiel die Zahl durch #1135 und #1154 von 11 auf 8, obwohl
        # die Bestliste von boss-1-1 an allen Ständen bitgleich 9272 erzielt —
        # die Suche fand nur einen anderen Weg (9068). Einzelheiten im Kopf von
        # sim/examples/zauber-abdeckung.rs.
        #
        # Hier und nicht im PR-Gate: 28 s gemessen (2026-08-14, rustbuild,
        # --release). Das ist für den Nightly tragbar und für jeden PR nicht.
        run: cargo run --release --quiet --example zauber-abdeckung --manifest-path sim/Cargo.toml

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CodeQL
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "CodeQL wird aktiviert, sobald TypeScript-Code vorliegt (Epic E1)."
          else
            echo "Noch kein Code. Übersprungen."
          fi
