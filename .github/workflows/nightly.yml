name: Nightly

# Alles Schwere. Blockiert nie einen PR (WORKER-GUIDE: PR-Gate unter 3 Minuten).
# Der Balance-Lauf mit tausenden Durchgängen gehört genau hierhin.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      # #891 N4: Die Wanduhr des ganzen Laufs zählt ab hier — der letzte
      # Schritt schreibt sie in die Zusammenfassung, gegen die 6-h-Grenze
      # GitHub-gehosteter Jobs.
      - name: Beginn festhalten
        shell: bash
        run: echo "NACHTLAUF_BEGINN=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Compiler aus rust-toolchain.toml, wie im PR-Gate (ci.yml, Job sim) —
      # derselbe, mit dem cargo remote v2 baut.
      - id: pin
        name: Rust-Pin lesen
        shell: bash
        run: |
          pin=$(python3 -B tools/rust-pin.py)
          echo "toolchain=$pin" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: ${{ steps.pin.outputs.toolchain }}
      - name: Gepinnter Compiler aktiv
        shell: bash
        run: python3 -B tools/rust-pin.py --rustc "$(rustc --version)"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Referenz-Rechnung Schritt 1
        run: python3 tools/step1-check.py
      # Alles Folgende im Release-Bau. Im Debug ist der Läufer rund achtzehnmal
      # langsamer — für zehntausend Durchgänge ist das der Unterschied zwischen
      # Sekunden und Minuten.
      - name: Balance-Lauf
        run: |
          cargo run --release --quiet --example balance \
            --manifest-path sim/Cargo.toml -- --iterations 10000 --threads 4
      - name: Boss-Machbarkeit und Erfolgs-Prüflauf
        # #891 N1: über jeden wertungsfähigen Boss, je mit gesuchter Rotation.
        # Endet mit 1, wenn für eine Kombination ein Erfolg ohne gefundene
        # Lösung bleibt — dann gilt der Boss als nicht auslieferbar (Masterplan,
        # „Prüflauf vor Auslieferung").
        #
        # #891 N4: Wanduhr und Kampfzahl je Posten gehen in die Zusammenfassung
        # des Laufs, auch wenn der Bericht rot endet — gerade dann wird sie
        # gelesen. Deshalb `set +e` um den Lauf und der Exit-Code danach.
        shell: bash
        run: |
          posten="$RUNNER_TEMP/posten.md"
          set +e
          cargo run --release --quiet --example report --manifest-path sim/Cargo.toml -- --posten-md "$posten"
          rc=$?
          set -e
          if [ -f "$posten" ]; then
            cat "$posten" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Posten-Tabelle fehlt: der Bericht endete mit $rc, bevor er sie schrieb." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
      - name: Abgleich Simulator gegen Spiel
        # Läuft im PR-Gate bereits, hier zusätzlich im Release-Bau: Optimierungen
        # dürfen Fließkomma-Operationen umordnen, und die Zustands-Prüfsumme
        # rührt Fließkomma-Bits ein.
        run: cargo run --release --quiet --example parity --manifest-path sim/Cargo.toml
      - name: Fingerabdruck des Simulators
        # #891 N5: Die Balance-Zahlen entstehen auf node3, dieser Lauf auf
        # ubuntu-latest. Derselbe Commit muss auf beiden denselben Wert liefern;
        # der Wert steht deshalb in der Zusammenfassung des Laufs, zum Vergleich
        # mit `rota-sim verify --print-fingerprint` auf node3. `verify` endet mit
        # 1, wenn einer seiner Selbsttests scheitert (auch Strangunabhängigkeit).
        shell: bash
        run: |
          set -o pipefail
          wert=$(cargo run --release --quiet --bin rota-sim --manifest-path sim/Cargo.toml -- verify --print-fingerprint)
          echo "Fingerabdruck ${GITHUB_SHA}: ${wert}"
          echo "Fingerabdruck \`${GITHUB_SHA}\`: \`${wert}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Zauber-Abdeckung der ersten Instanz
        # Issue #550 AC5. Endet mit 1, wenn über die vier Bosse der ersten
        # Instanz weniger als 11 spielbare Zauber gewirkt werden — dann hat ein
        # Zauber seine Nische verloren oder ein Boss erzwingt sie nicht mehr.
        #
        # Gezählt werden NISCHEN, nicht Suchwege (Variante B, 29.10.): je Boss
        # die bessere von freier Suche und Bestliste vom 14.08. Mit der freien
        # Suche allein fiel die Zahl durch #1135 und #1154 von 11 auf 8, obwohl
        # die Bestliste von boss-1-1 an allen Ständen bitgleich 9272 erzielt —
        # die Suche fand nur einen anderen Weg (9068). Einzelheiten im Kopf von
        # sim/examples/zauber-abdeckung.rs.
        #
        # Hier und nicht im PR-Gate: 28 s gemessen (2026-08-14, rustbuild,
        # --release). Das ist für den Nightly tragbar und für jeden PR nicht.
        run: cargo run --release --quiet --example zauber-abdeckung --manifest-path sim/Cargo.toml
      - name: Wanduhr des Nachtlaufs
        # #891 N4: Die ruhenden Pakete in #891 Abschnitt 4 hängen an dieser
        # Zahl. Der Lauf bleibt auf ubuntu-latest, bis sie die 6-h-Grenze
        # GitHub-gehosteter Jobs erreicht. `always()`, damit sie auch nach
        # einem roten Schritt dasteht — dann fehlen die übersprungenen Schritte
        # darin, und das sagt die Zeile.
        if: always()
        shell: bash
        env:
          STATUS: ${{ job.status }}
        run: |
          sekunden=$(( $(date +%s) - NACHTLAUF_BEGINN ))
          echo "Nachtlauf ${GITHUB_SHA}: ${sekunden} s Wanduhr, Job-Status ${STATUS}"
          {
            echo "### Wanduhr des Nachtlaufs (#891 N4)"
            echo
            echo "\`${GITHUB_SHA}\`: **${sekunden} s** vom ersten bis zu diesem Schritt (Grenze GitHub-gehosteter Jobs: 21600 s), Job-Status ${STATUS}."
            echo "Bei einem anderen Status als success fehlen die übersprungenen Schritte in dieser Zahl."
          } >> "$GITHUB_STEP_SUMMARY"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CodeQL
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "CodeQL wird aktiviert, sobald TypeScript-Code vorliegt (Epic E1)."
          else
            echo "Noch kein Code. Übersprungen."
          fi
