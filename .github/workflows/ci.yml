name: CI

# Ziel: PR-Gate unter 3 Minuten (siehe docs/WORKER-GUIDE.md).
# Der Overhead je Issue ist der ganze Zyklus, nicht nur die CI-Zeit — deshalb
# laufen hier nur die Prüfungen, die JEDE Änderung betreffen. Alles Schwere
# (Balance-Lauf, Boss-Machbarkeit, CodeQL) läuft nachts in nightly.yml.

on:
  push:
    branches: [main]
  pull_request:
    # `edited` gehört dazu, weil ein BASISWECHSEL keiner der Standardtypen ist
    # (opened, synchronize, reopened). Am 2026-08-18 gemessen an PR #890: Er war
    # gegen einen anderen Zweig geöffnet worden, also lief die CI nie an. Als der
    # Basiszweig danach auf main umsprang, lief sie WIEDER nicht — der PR trug
    # daraufhin genau einen Check, und alles Übrige fehlte einfach. Ein Stand
    # ohne Prüfung sieht dabei aus wie ein Stand ohne Fehler.
    types: [opened, synchronize, reopened, edited]
    branches: [main]

# Ein neuer Push bricht den vorherigen Lauf ab.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Pfad-Filter
  # Reine Doku-Änderungen überspringen alle Code-Jobs. Ohne das zahlt jede
  # Korrektur an einer Markdown-Datei die volle Bauzeit.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      sim: ${{ steps.filter.outputs.sim }}
      rules: ${{ steps.filter.outputs.rules }}
    steps:
      # fetch-depth: 0 ist hier nötig. Mit einem flachen Klon haben PR-Branch und
      # Zielzweig keine gemeinsame Basis ("fatal: no merge base"), und der Filter
      # bricht ab — bei Dependabot-PRs zuverlässig reproduzierbar.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          else
            FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)
          fi
          echo "Geänderte Dateien:"
          printf '%s\n' "$FILES"

          # Gibt "true"/"false" zurück, je nachdem ob eine Datei auf das Muster passt.
          match() { if printf '%s\n' "$FILES" | grep -qE "$1"; then echo true; else echo false; fi; }
          # "code" ist alles außer reiner Dokumentation.
          nondoc() { if printf '%s\n' "$FILES" | grep -qvE '^(docs/|.*\.md)$'; then echo true; else echo false; fi; }

          {
            echo "code=$(nondoc)"
            # data/ MUSS dabei sein: sim/build.rs kompiliert die Zauber- und
            # Boss-Daten zur Bauzeit ein. Ohne data/ im Filter aendert jemand
            # einen Zauberwert, die Rust-Tests laufen NICHT, der Simulator ist
            # still falsch — und ci-pass meldet gruen. Cargo.toml/Cargo.lock
            # liegen seit PR #64 im Wurzelverzeichnis (Workspace), damit der
            # Remote-Bau data/ ueberhaupt zu sehen bekommt.
            # tests/parity/recordings/ MUSS dabei sein: Die Rust-Tests lesen die
            # Vergleichsdateien per include_str! — sie sind Eingabe der Tests,
            # nicht nur Erzeugnis des Spiels. Ohne sie im Filter erzeugt jemand
            # eine Vergleichsdatei neu, die Rust-Tests laufen NICHT, und ein
            # falscher Vergleichsstand geht durch (Issue #173). Gemessen: EINE
            # verfaelschte Pruefsumme in fixation.json laesst parity_fixation
            # mit Exit 101 scheitern — die Stufe haette also etwas zu pruefen.
            #
            # Dass diese Liste vollstaendig BLEIBT, prueft
            # tests/unit/ci-sim-filter.test.ts aus den include_str!-Zeilen
            # selbst. Eine von Hand gefuehrte Abschrift kann nicht bemerken,
            # dass ihr ein Eintrag fehlt (#134, #138, #159, und hier).
            # .github/workflows/ci.yml MUSS dabei sein: Diese Datei enthaelt die
            # Befehle der sim-Stufe selbst. Ohne sie im Muster aendert jemand den
            # Testbefehl — streicht --all-targets, faellt ein Merkmal weg, wird
            # ein Schritt entfernt —, die Stufe laeuft NICHT, und ci-pass meldet
            # gruen. Gemessen an PR #995: Die Aenderung, die zwei Testbefehle
            # daraus macht, hat den sim-Job auf "skipping" gesetzt. Sie konnte
            # sich selbst nicht pruefen.
            #
            # Dieselbe Klasse wie #134, #138, #159 und die Zeilen darueber, nur
            # eine Ebene hoeher: Dort fehlten Eingaben der Pruefung im Muster,
            # hier fehlt die DEFINITION der Pruefung.
            echo "sim=$(match '^(sim/|data/|tests/parity/recordings/|Cargo\.toml$|Cargo\.lock$|\.github/workflows/ci\.yml$)')"
            # "rules" ist bewusst KEINE Pfadliste mehr, sondern dasselbe wie
            # "code": alles außer reiner Dokumentation.
            #
            # Die frühere Fassung zählte auf, wo Regeln liegen dürfen
            # (data/, src/core/, sim/, tools/, tests/parity/). Zweimal ging das
            # schief, weil ein Pfad fehlte:
            #   PR #41  tools/step1-check.py IST die Referenz — eine geänderte
            #           Referenz ging ungeprüft durch
            #   PR #89  src/combat/ kam neu dazu. Von Worker-2 gemeldet, BEVOR
            #           #87 dort die Regeln anschließt: Der parity-Job wäre
            #           nicht gelaufen, eine Abweichung zwischen Spiel und
            #           Simulator hätte ci-pass grün passiert.
            #
            # Eine Liste, die jemand bei jedem neuen Verzeichnis ergänzen muss,
            # wird irgendwann vergessen — und niemand merkt es, weil das
            # Ergebnis grün aussieht. Der Job kostet 26 Sekunden.
            echo "rules=$(nondoc)"
          } >> "$GITHUB_OUTPUT"
      - name: Ergebnis
        run: |
          echo "code=${{ steps.filter.outputs.code }}"
          echo "sim=${{ steps.filter.outputs.sim }}"
          echo "rules=${{ steps.filter.outputs.rules }}"

  # ------------------------------------------------------------------ TypeScript
  lint:
    needs: changes
    # KEIN Pfad-Filter. `npm run lint` fuehrt `prettier --check .` ueber ALLE
    # Dateien aus, auch ueber Markdown — eine reine Dokumentaenderung kann die
    # Stufe also brechen, ohne dass sie je laeuft. Genau so geschehen bei
    # PR #75 (2026-07-29): Der Filter uebersprang lint, der PR ging gruen
    # durch, und danach fiel die Stufe in JEDEM PR, der von main abzweigte —
    # zuerst bei Worker-2 in #86, der nichts falsch gemacht hatte.
    #
    # Der Job kostet 23 Sekunden. Das ist der Preis dafuer, dass ein gruener
    # PR auch wirklich gruen ist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

      # #1100: Python is not covered by tsc, eslint or the game unit suite.
      # No tool is imported for the syntax check: paid APIs and asset writers
      # receive no credentials and cannot run as a side effect of discovery.
      - name: Python tools syntax and behavior
        run: python3 -B tools/python-check.py --tests

      - name: Simulator planning registry
        run: python3 -B tools/sim-registry.py --check

      # #1051: The probes deliberately damage inputs. They run the real guards
      # in a disposable copy, with SHA-256 readback after each probe, rather
      # than mutating the checkout used by subsequent checks.
      - name: Guard counterexamples in isolated checkout
        run: python3 -B tools/gegenproben-ci.py

      # CVE-2021-42574 (Trojan Source): unsichtbare Steuerzeichen können den
      # Quelltext anders aussehen lassen, als der Compiler ihn liest.
      - name: Versteckte Unicode-Steuerzeichen
        shell: bash
        run: |
          set -euo pipefail
          # Bidi-Overrides und Zero-Width-Zeichen
          PATTERN=$'‪|‫|‬|‭|‮|⁦|⁧|⁨|⁩|​|‌|‍|﻿'
          # Nur eigener Quelltext. node_modules enthält legitime Unicode-Zeichen
          # (z. B. TypeScripts lib.es2015.core.d.ts und übersetzte Meldungen).
          if grep -rlP "$PATTERN" \
               --include='*.ts' --include='*.js' --include='*.json' \
               --include='*.html' --include='*.css' \
               src tests data index.html 2>/dev/null; then
            echo "::error::Versteckte Unicode-Steuerzeichen gefunden (CVE-2021-42574)."
            exit 1
          fi
          echo "Keine versteckten Steuerzeichen im eigenen Quelltext gefunden."

      # Zwei Sitzungen, die vom selben Stand abzweigen, vergeben dieselbe
      # naechste Abschnittsnummer. Aufgefallen ist das am 2026-08-19 nur, weil
      # beide Bloecke am Dateiende standen und git einen Konflikt meldete —
      # an verschiedenen Stellen waere der Merge glatt durchgelaufen.
      # Steht hier und nicht in einem eigenen Job: Der Schritt kostet
      # Millisekunden und braucht dieselbe Voraussetzung wie prettier — gar
      # keine.
      - name: Abschnittsnummern in den Dokumenten
        shell: bash
        run: bash tools/guide-abschnittsnummern.sh

      - name: Interne Verweise in den Dokumenten
        shell: bash
        run: bash tools/guide-anker.sh

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # GAME-DESIGN 19.3: Die Entwicklungs-Werkzeuge müssen aus der
      # Auslieferung vollständig herausgeschnitten sein — kein Byte davon.
      - name: Dev-Werkzeuge nicht im Auslieferungs-Bundle
        shell: bash
        run: |
          set -euo pipefail
          if grep -rl "__ROTA_DEVTOOLS__" dist/ 2>/dev/null; then
            echo "::error::Dev-Werkzeuge sind im Auslieferungs-Bundle gelandet."
            exit 1
          fi
          echo "Auslieferungs-Bundle enthält keine Dev-Werkzeuge."

  # ---------------------------------------------------------- Rust (Simulator)
  # Läuft nur, wenn sim/ betroffen ist — sonst zahlt jede TypeScript-Änderung
  # Rust-Bauzeit.
  sim:
    needs: changes
    if: needs.changes.outputs.sim == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Das Bau-Verzeichnis liegt in der Wurzel, weil dort der Workspace
          # definiert ist. Mit "sim" griffe der Cache ins Leere.
          workspaces: .
      # Aus der Wurzel, nicht aus sim/: --all erfasst so den ganzen Workspace
      # und nicht nur das eine Paket, das heute darin liegt.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Der erste Lauf bleibt unberührt: Er sichert zu, dass die Bibliothek
      # OHNE das Merkmal übersetzt und grün ist. Der zweite holt 35 Prüffälle
      # dazu, die `cargo test` allein NIE ausführt — aus DREI verschiedenen
      # Gründen, die man leicht für einen hält:
      #
      #   --features diagnostics   sim/tests/diagnose_im_kampf.rs      8 Fälle
      #        Die Datei trägt `#![cfg(feature = "diagnostics")]`. Ohne das
      #        Merkmal übersetzt sie zu einer LEEREN Suite und meldet
      #        „test result: ok. 0 passed" — grün, und sie hat nichts angesehen.
      #
      #   --all-targets            sim/examples/messumgebung.rs       21 Fälle
      #                            sim/examples/trace-stabilitaet.rs   3 Fälle
      #        `cargo test` BAUT Beispiele, führt ihre `#[test]` aber nicht aus.
      #        `main()` läuft dabei nie — nur die Prüffälle.
      #
      #   --features diagnostics   sim/src/balance.rs                  3 Fälle
      #        `balance::tests::ac3_der_reduzierte_lauf_rechnet_genau_einen_kampf`
      #        `balance::tests::ac3_auch_der_suchpfad_rechnet_nur_einen_kampf`
      #        `balance::tests::ac6_ein_kampflauf_bestimmt_keine_auspraegung_neu`
      #        Diese drei stehen NICHT in einer eigenen Datei, sondern einzeln
      #        hinter `#[cfg(feature = "diagnostics")]` IN der Bibliothek. Wer
      #        die Zusatzfälle über Dateien sucht, findet sie deshalb nicht —
      #        bis zum 2026-08-19 stand hier „25 Prüffälle aus ZWEI Gründen",
      #        und die drei fehlten in der Zahl.
      #
      #        Gefunden über einen Vergleich der `--list`-Ausgaben beider
      #        Bauten: `cargo test --no-run` gegen `--all-targets --features
      #        diagnostics`, die Namen mit `comm -13` gegeneinander gehalten.
      #        Die lib-Suite geht dabei von 186 auf 189. Wer die Zahl erneut
      #        prüfen will, nimmt denselben Weg — eine Zahl allein wäre in
      #        einem Jahr wieder eine unbelegte Angabe.
      #
      # Die 8 sind die wichtigsten: Sie prüfen, ob die Auswertung überhaupt
      # etwas zu rechnen BEKOMMT. Die 7 in diagnostics.rs prüfen nur, dass sie
      # rechnet — und blieben grün, wenn der Kampf die Zähler nie füttert.
      - run: cargo test --all-targets --features diagnostics

  # ------------------------------------------------------------------- Parität
  # Aufgezeichnete Runden müssen in Spiel UND Simulator denselben Wert ergeben
  # (GAME-DESIGN 18.4). Läuft nur, wenn die Regeln betroffen sind.
  parity:
    needs: changes
    if: needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # Die dritte Umsetzung derselben Regeln (GAME-DESIGN 18.4) — ohne sie
      # prüft dieser Job nur zwei von drei Seiten.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Referenz-Rechnung Schritt 1
        run: python3 tools/step1-check.py
      - name: Gemeinsame Prüffälle
        shell: bash
        run: |
          set -euo pipefail
          # Auf tatsächliche Testdateien prüfen, nicht auf den Ordner: der
          # existiert von Anfang an (mit .gitkeep), und vitest bricht ab, wenn
          # es nichts zu tun findet.
          if compgen -G 'tests/parity/*.test.ts' > /dev/null; then
            npm ci
            npm run test:parity
          else
            echo "Noch keine Prüffälle vorhanden (kommen mit Epic E2). Übersprungen."
          fi
      # ---------------------------------------------------------------------
      # Die Vergleichsdateien sind der MASSSTAB der Prüfsummen-Prüffälle. Sind
      # sie älter als die Regeln, laufen beide Seiten gegen einen veralteten
      # Wert und melden grün, weil sie dieselbe alte Zahl reproduzieren
      # (Issue #278).
      #
      # Der Export hat zwei Rollen, und nur eine gehört hierher:
      #   erzeugen  NEIN — ein Gate, das schreibt, verändert den Prüfgegenstand
      #   prüfen    JA  — „läuft er, und ändert er nichts?"
      #
      # Der Anlass: Der Export war seit 9d0885b kaputt (Exit 127) und acht
      # Stunden lang fiel es niemandem auf, während vier PRs durchgingen.
      # Repariert wurde er in PR #277 — der Grund, warum niemand es merkte,
      # nicht. Ein `grep -rn "export-parity" .github/workflows/` fand damals
      # keinen Treffer.
      - name: Vergleichsdateien sind aktuell
        shell: bash
        run: |
          set -euo pipefail
          # Erster Teil: Läuft der Export überhaupt? Das fängt den #277-Fall.
          npx vite-node tests/parity/export-parity.mjs

          # Zweiter Teil, und DAS ist der eigentliche Nachweis: Hat er etwas
          # verändert? Wenn ja, waren die eingecheckten Dateien nicht auf dem
          # Stand der Regeln — der Rückgabewert allein hätte das nicht gezeigt.
          if [ -n "$(git status --porcelain -- tests/parity/recordings/)" ]; then
            echo "::error::Die Vergleichsdateien sind nicht auf dem Stand der Regeln. Führe 'npm run parity:export' aus und checke das Ergebnis ein."
            git --no-pager diff --stat -- tests/parity/recordings/
            exit 1
          fi
          echo "Die Vergleichsdateien entsprechen dem heutigen Regelstand."
      - name: Simulator gegen Spiel
        shell: bash
        run: |
          set -euo pipefail
          # Die aufgezeichnete Runde muss in beiden Umsetzungen denselben Schaden
          # und dieselbe Zustands-Prüfsumme je Takt ergeben. Weicht etwas ab,
          # nennt die Ausgabe den Takt (Issue #54, AC4).
          cargo run --quiet --example parity --manifest-path sim/Cargo.toml
          cargo test --quiet --manifest-path sim/Cargo.toml \
            --test parity_recording --test parity_primitives --test reference

  # ------------------------------------------------------------------- Hygiene
  # Beide hängen NICHT am Pfad-Filter: Ein Geheimnis kann in jeder Datei landen,
  # auch in einer reinen Dokumentations-Änderung.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
        with:
          reporter: github-pr-check
          fail_on_error: true

  # gitleaks direkt als Binary statt über gitleaks-action:
  # Die Action verlangt für Organisationen eine kostenpflichtige Lizenz
  # ("[silentspike] is an organization. License key is required."), das
  # Werkzeug selbst ist MIT-lizenziert und frei nutzbar.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks installieren
        shell: bash
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Verlauf nach Geheimnissen durchsuchen
        shell: bash
        run: gitleaks git --no-banner --redact --exit-code 1 .

  # -------------------------------------------------------------------- ci-pass
  # DER EINZIGE REQUIRED CHECK.
  #
  # Warum das der wichtigste Job der Datei ist: Die Branch Protection muss nie
  # wieder angefasst werden, wenn ein Job dazukommt oder umbenannt wird. Genau
  # dort verliert man sonst bei jedem Umbau eine halbe Stunde.
  #
  # if: always() ist zwingend — ohne das würde ci-pass selbst übersprungen,
  # sobald ein benötigter Job übersprungen wurde, und der Required Check bliebe
  # ewig "pending".
  ci-pass:
    needs: [changes, lint, typecheck, unit, build, sim, parity, actionlint, secret-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Ergebnisse aller Jobs prüfen
        shell: bash
        run: |
          set -euo pipefail

          # changes zuerst und gesondert: Fällt der Pfad-Filter aus, werden ALLE
          # anderen Jobs übersprungen. Ohne diese Prüfung würde "skipped" als in
          # Ordnung durchgehen und ci-pass grün melden, obwohl nichts geprüft
          # wurde — der gefährlichste denkbare Fehler in einem Required Check.
          CHANGES="${{ needs.changes.result }}"
          if [ "$CHANGES" != "success" ]; then
            printf '  %-12s FEHLGESCHLAGEN (%s)\n' "changes" "$CHANGES"
            echo "::error::Der Pfad-Filter ist ausgefallen — es wurde nichts geprüft."
            exit 1
          fi
          printf '  %-12s bestanden\n' "changes"

          declare -A R=(
            [lint]="${{ needs.lint.result }}"
            [typecheck]="${{ needs.typecheck.result }}"
            [unit]="${{ needs.unit.result }}"
            [build]="${{ needs.build.result }}"
            [sim]="${{ needs.sim.result }}"
            [parity]="${{ needs.parity.result }}"
            [actionlint]="${{ needs.actionlint.result }}"
            # Klammer-Notation: GitHub-Actions-Ausdrücke lösen "needs.secret-scan"
            # nicht auf, weil der Bindestrich in der Punkt-Notation nicht erlaubt ist.
            [secret-scan]="${{ needs['secret-scan'].result }}"
          )
          FAILED=0
          for job in "${!R[@]}"; do
            case "${R[$job]}" in
              success)   printf '  %-12s bestanden\n' "$job" ;;
              skipped)   printf '  %-12s übersprungen (Pfad-Filter)\n' "$job" ;;
              *)         printf '  %-12s FEHLGESCHLAGEN (%s)\n' "$job" "${R[$job]}"; FAILED=1 ;;
            esac
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Mindestens ein Job ist fehlgeschlagen."
            exit 1
          fi
          echo "Alle Jobs bestanden oder bewusst übersprungen."
