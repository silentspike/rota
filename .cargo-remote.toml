# Bau-Server fuer den Simulator (CLAUDE.md, Abschnitt "RUST REMOTE BUILD").
#
# `cargo remote` sucht diese Datei im Wurzelverzeichnis des Workspace — deshalb
# liegt sie hier und nicht in `sim/` (Begruendung siehe Cargo.toml).
#
#   cargo remote -c -- build          # das -c ist Pflicht
#   cargo remote -c -- test --no-run > /work/tmp/bau.log
#   bash tools/tests-lokal.sh /work/tmp/bau.log
#   cargo remote -c -- clippy --all-targets -- -D warnings
#   cargo-remote-fmt                  # NICHT `cargo remote -- fmt`
#   cargo-remote-fmt --check          # CI-Paritaet, vor jedem Push
[[remote]]
host = "root@10.0.0.155"
temp_dir = "/tmp/builds"
